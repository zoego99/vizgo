</head>
<body>

<!-- ===== NAV ===== -->

<!-- ===== PAGE HEADER ===== -->
<div class="page-header">
  <h1>視覺風格 畫廊</h1>
  <p>參考下方風格預覽，確定心儀風格後回到生成器點選對應名稱即可。</p>
</div>

<!-- ===== GALLERY BODY (由 JS 動態生成) ===== -->
<div class="gallery-body" id="gallery-body"></div>

<!-- ===== FOOTER ===== -->
<footer>
  <!-- ★ 修改這裡換成你的 Email ★ -->
  <p>Nano Banana 資訊圖 Prompt 工具 &nbsp;|&nbsp; <span>心怡｜zoego99@gmail.com</span></p>

<!-- ===== LIGHTBOX ===== -->
<div class="lightbox-overlay" id="lightbox-overlay" onclick="handleOverlayClick(event)">
  <div class="lightbox-box" id="lightbox-box">
    <button class="lb-close" onclick="closeLightbox()">✕</button>

    <div class="lb-main-img-wrap" id="lb-main-wrap"></div>

    <button class="lb-arrow prev hidden" id="lb-prev" onclick="lbNavigate(-1)">&#8592;</button>
    <button class="lb-arrow next hidden" id="lb-next" onclick="lbNavigate(1)">&#8594;</button>

    <div class="lb-info" id="lb-info">
      <div class="lb-style"><div class="lb-style-name" id="lb-style-name"></div><div class="lb-style-desc" id="lb-style-desc"></div></div>
      <div class="lb-sub-row">
        <span class="lb-sub-bullet">►</span>
        <span id="lb-sub-title"></span>
        <span id="lb-counter" class="lb-counter"></span>
      </div>
    </div>

    <div class="lb-thumb-strip hidden" id="lb-thumb-strip"></div>
  </div>
</div>

<script src="script-gallery.js"></script>
</body>
